name: onlyaudio_by_audiofeel
description: Melophily by AudioFeel desktop player
publish_to: "none"
version: 2.5.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  flutter_media_metadata: ^1.0.0+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_macos_audio: ^1.0.9
  media_kit_libs_linux: ^1.0.9
  window_manager: ^0.4.0
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  audio_service_mpris: ^0.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - logo.JPG
    - assets/bg_default.png

# Microsoft Store (Partner Center product "Melophily", reserved 2026-11-17). The identity values
# below are the ones the Store assigned; they are not ours to change. `store: true` builds an
# unsigned package for upload: the Store signs it, so no code-signing certificate is needed.
msix_config:
  display_name: Melophily
  publisher_display_name: Block Rocking Bytes
  identity_name: BlockRockingBytes.Melophily
  publisher: CN=D4F08B06-6E8B-41B0-A62A-9E76FDBBA164
  msix_version: 2.5.0.0
  logo_path: screenshots\onlyaudio_cover_600x600.png
  capabilities: privateNetworkClientServer
  languages: fr-fr, en-us
  store: true
